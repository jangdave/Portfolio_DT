[project]
name = "dctwin-sensors"
version = "0.1.0"
description = "DC-Twin 센서 값 생성기: 시나리오에 따라 가상 센서 값을 만들고 알람을 판정한다"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest",
]
